name: Build Linux x64 binary

# Personal fork helper: builds the standalone gateway (UI embedded) for
# linux x64 inside manylinux containers with NATIVE toolchains, so the
# resulting binaries are compatible with old glibc versions without
# cross-compiler surprises. Both binaries are published to public
# artifacts/* branches (raw direct-download URLs, no GitHub login), and a
# WeChat notification with those URLs is pushed at the end when the
# WECHAT_PUSH_KEY secret is configured.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-ui:
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build UI
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Upload ui/dist
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error

  build-glibc-2-28:
    runs-on: ubuntu-24.04
    needs: build-ui
    permissions:
      contents: write
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: dnf install -y cmake perl unzip && dnf clean all
      - name: Download ui/dist
        run: |
          SIGNED=$(curl -sS -o /dev/null -w '%{redirect_url}' \
            -H "Authorization: token ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${{ needs.build-ui.outputs.artifact_id }}/zip")
          test -n "$SIGNED"
          curl -sSL -o ui-dist.zip "$SIGNED"
          unzip -q ui-dist.zip -d ui/dist
      - name: Install Rust toolchain
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          . "$HOME/.cargo/env"
          rustup --version
      - name: Build gateway (release, glibc 2.28, UI embedded)
        run: |
          . "$HOME/.cargo/env"
          cargo build --release -p agentgateway-app --features ui
      - name: Report glibc symbol floor
        run: |
          echo "highest GLIBC symbol version referenced:"
          objdump -T target/release/agentgateway | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1
      - name: Rename binary
        run: cp target/release/agentgateway agentgateway-linux-x64-glibc2.28
      # Publish to an artifacts branch for a public raw download URL (Actions
      # artifacts need a GitHub login); git is available in this container.
      - name: Push binary to artifacts branch
        run: |
          unset GIT_DIR GIT_WORK_TREE
          cd "${GITHUB_WORKSPACE}"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config user.email "actions@github.com"
          git config user.name "artifact-bot"
          git checkout -b artifacts/glibc2.28
          git add agentgateway-linux-x64-glibc2.28
          git commit -m "artifact: glibc 2.28 build of ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" artifacts/glibc2.28
      - name: Print raw download URL
        run: echo "https://raw.githubusercontent.com/${{ github.repository }}/artifacts/glibc2.28/agentgateway-linux-x64-glibc2.28"

  build-glibc-2-17:
    runs-on: ubuntu-24.04
    needs: build-ui
    permissions:
      contents: write
    container:
      image: quay.io/pypa/manylinux2014_x86_64
    steps:
      # actions/checkout needs a newer node/glibc than this container has;
      # clone with the container's own git instead.
      - name: Checkout
        shell: bash
        run: |
          git clone --depth 1 --branch "${{ github.ref_name }}" \
            "${{ github.server_url }}/${{ github.repository }}.git" .
      - name: Install build tools
        run: yum install -y cmake3 unzip perl-core && ln -sf /usr/bin/cmake3 /usr/local/bin/cmake
      - name: Download ui/dist
        run: |
          SIGNED=$(curl -sS -o /dev/null -w '%{redirect_url}' \
            -H "Authorization: token ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${{ needs.build-ui.outputs.artifact_id }}/zip")
          test -n "$SIGNED"
          curl -sSL -o ui-dist.zip "$SIGNED"
          unzip -q ui-dist.zip -d ui/dist
      - name: Install Rust toolchain
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          . "$HOME/.cargo/env"
          rustup --version
      - name: Build gateway (release, glibc 2.17, UI embedded)
        run: |
          . "$HOME/.cargo/env"
          cargo build --release -p agentgateway-app --features ui
      - name: Report glibc symbol floor
        run: |
          echo "highest GLIBC symbol version referenced:"
          objdump -T target/release/agentgateway | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1
      - name: Rename binary
        run: cp target/release/agentgateway agentgateway-linux-x64-glibc2.17
      # upload-artifact needs node24 (glibc 2.28+), unavailable in this container;
      # push the binary to an artifacts branch with the container's own git instead.
      - name: Push binary to artifacts branch
        run: |
          unset GIT_DIR GIT_WORK_TREE
          cd "${GITHUB_WORKSPACE}"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config user.email "actions@github.com"
          git config user.name "artifact-bot"
          git checkout -b artifacts/glibc2.17
          git add agentgateway-linux-x64-glibc2.17
          git commit -m "artifact: glibc 2.17 build of ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" artifacts/glibc2.17
      - name: Print raw download URL
        run: echo "https://raw.githubusercontent.com/${{ github.repository }}/artifacts/glibc2.17/agentgateway-linux-x64-glibc2.17"

  # Push a WeChat notification with the public download URLs once everything
  # finished (success or not). Requires the WECHAT_PUSH_KEY repo secret; the
  # job is a no-op when it is not configured.
  notify:
    runs-on: ubuntu-latest
    needs: [build-glibc-2-17, build-glibc-2-28]
    if: ${{ always() && !cancelled() }}
    steps:
      - name: Push WeChat notification
        env:
          WECHAT_PUSH_KEY: ${{ secrets.WECHAT_PUSH_KEY }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT_217: ${{ needs.build-glibc-2-17.result }}
          RESULT_228: ${{ needs.build-glibc-2-28.result }}
        run: |
          if [ -z "$WECHAT_PUSH_KEY" ]; then
            echo "WECHAT_PUSH_KEY secret not set; skipping notification"
            exit 0
          fi
          SHORT_SHA="${SHA:0:7}"
          if [ "$RESULT_217" = "success" ] && [ "$RESULT_228" = "success" ]; then
            TITLE="agentgateway Linux 构建成功 (${REF_NAME}@${SHORT_SHA})"
            CONTENT="$(printf '✅ glibc 2.17 / 2.28 全部构建成功\n\n📦 产物直链（公开，无需登录）：\nhttps://raw.githubusercontent.com/%s/artifacts/glibc2.17/agentgateway-linux-x64-glibc2.17\nhttps://raw.githubusercontent.com/%s/artifacts/glibc2.28/agentgateway-linux-x64-glibc2.28\n\n🔨 构建详情：%s' "$REPO" "$REPO" "$RUN_URL")"
          else
            TITLE="agentgateway Linux 构建失败 (${REF_NAME}@${SHORT_SHA})"
            CONTENT="$(printf '❌ glibc 2.17: %s / glibc 2.28: %s\n\n🔨 构建详情：%s' "$RESULT_217" "$RESULT_228" "$RUN_URL")"
          fi
          PAYLOAD=$(jq -n --arg key "$WECHAT_PUSH_KEY" --arg title "$TITLE" --arg content "$CONTENT" \
            '{key: $key, type: "text", title: $title, content: $content}')
          RESP=$(curl -sS -X POST "https://send.4c43.work/sendMsg3.php" \
            -H "Content-Type: application/json" \
            --max-time 30 \
            -d "$PAYLOAD") || RESP="curl failed"
          echo "push response: $RESP"
          # Notification problems must not fail an otherwise-green build run,
          # but they should be visible.
          echo "$RESP" | grep -q '"errcode":0' \
            || echo "::warning::WeChat push may have failed: $RESP"
