name: Build Linux x64 binary

# Personal fork helper: builds the standalone gateway (UI embedded) for
# linux x64 and uploads the binary as a workflow artifact.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build UI (embedded into the binary)
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup toolchain install --profile minimal

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: Build gateway (release, UI embedded)
        run: cargo build --release -p agentgateway-app --features ui

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentgateway-linux-x64
          path: target/release/agentgateway
          if-no-files-found: error
